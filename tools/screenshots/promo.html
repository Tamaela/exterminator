<!doctype html>
<!-- Chrome Web Store promo images. Query: size=small (440 x 280) or marquee (1400 x 560). -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; overflow: hidden; }
  body {
    display: flex; align-items: center; box-sizing: border-box;
    background: linear-gradient(135deg, #0f3d22, #1a7f37);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff;
  }
  .brand { display: flex; align-items: center; }
  h1 { margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  p { margin: 0; opacity: 0.92; font-weight: 500; }
  body.small { width: 440px; height: 280px; padding: 0 36px; justify-content: center; }
  .small .brand { flex-direction: column; text-align: center; gap: 14px; }
  .small svg { width: 92px; height: 92px; }
  .small h1 { font-size: 38px; }
  .small p { font-size: 18px; margin-top: 6px; }
  body.marquee { width: 1400px; height: 560px; padding: 0 100px; justify-content: space-between; gap: 60px; }
  .marquee .brand { gap: 36px; min-width: 0; }
  .marquee svg { width: 170px; height: 170px; flex-shrink: 0; }
  .marquee h1 { font-size: 62px; white-space: nowrap; }
  .marquee p { font-size: 28px; margin-top: 12px; max-width: 460px; }
  iframe { flex-shrink: 0; border: 0; border-radius: 12px; background: #fff; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35); }
  .small iframe { display: none; }
</style>
<div class="brand">
  <!-- The shield of icons/ (see tools/make-icons.py), here white with a green check. -->
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <path d="M14 8 H86 V55 A36 39 0 0 1 14 55 Z" fill="#fff"/>
    <polyline points="33,50 45,63 68,37" fill="none" stroke="#1a7f37" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div>
    <h1>Tab Chaperone</h1>
    <p>Your other extensions stay out of your bank</p>
  </div>
</div>
<iframe id="popup" width="480" height="470"></iframe>
<script>
  const size = new URLSearchParams(location.search).get('size');
  document.body.className = size;
  if (size === 'marquee') document.getElementById('popup').src = '../preview/popup.html?s=strict';
</script>
