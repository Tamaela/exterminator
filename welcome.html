<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="welcomeTitle"></title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="options">
  <main>
    <header>
      <img src="icons/icon48.png" alt="">
      <h1 data-i18n="welcomeTitle"></h1>
    </header>

    <section class="card">
      <h2 data-i18n="welcomeWhatHeading"></h2>
      <ul class="welcome-list">
        <li data-i18n="welcomeWhat1"></li>
        <li data-i18n="welcomeWhat2"></li>
        <li data-i18n="welcomeWhat3"></li>
        <li data-i18n="welcomeWhat4"></li>
      </ul>
    </section>

    <section class="card">
      <h2 data-i18n="welcomeDataHeading"></h2>
      <ul class="welcome-list">
        <li data-i18n="welcomeData1"></li>
        <li data-i18n="welcomeData2"></li>
      </ul>
    </section>

    <section class="card">
      <h2 data-i18n="welcomeNoteHeading"></h2>
      <ul class="welcome-list">
        <li data-i18n="welcomeNote1"></li>
        <li data-i18n="welcomeNote2"></li>
      </ul>
    </section>

    <section class="card" id="consent">
      <button id="agree" data-i18n="welcomeAgree"></button>
      <p class="ok" id="agreed" data-i18n="welcomeAgreed" hidden></p>
      <button id="open-settings" class="secondary" data-i18n="welcomeOpenSettings" hidden></button>
    </section>
  </main>
  <script type="module" src="welcome.js"></script>
</body>
</html>
