<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="optionsTitle"></title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="options">
  <main>
    <header>
      <img src="icons/icon48.png" alt="">
      <h1 data-i18n="extName"></h1>
    </header>

    <p class="banner" id="incognito-warning" data-i18n-html="incognitoWarningHtml" hidden></p>

    <section class="card alert-card" id="alerts-card" hidden>
      <h2 data-i18n="alertsHeading"></h2>
      <p class="muted" data-i18n="alertsIntro"></p>
      <ul id="alerts" class="alert-list"></ul>
    </section>

    <section class="card" id="asks-card" hidden>
      <h2 data-i18n="asksHeading"></h2>
      <p class="muted" data-i18n="asksIntro"></p>
      <p class="ask-actions">
        <button id="asks-clear" class="secondary" data-i18n="asksClear" data-i18n-title="asksClearHelp"></button>
        <button id="asks-dismiss-all" class="secondary" data-i18n="asksDismissAll"></button>
      </p>
      <div id="asks"></div>
    </section>

    <section class="card">
      <h2 data-i18n="sitesHeading"></h2>
      <p class="muted" data-i18n="sitesIntro"></p>
      <form id="add-site" class="row">
        <input type="text" id="new-domain" data-i18n-placeholder="domainPlaceholder" spellcheck="false">
        <select id="new-level">
          <option value="strict" data-i18n="level_strict" selected></option>
          <option value="site" data-i18n="level_site"></option>
          <option value="login" data-i18n="level_login"></option>
        </select>
        <button type="submit" data-i18n="add"></button>
      </form>
      <p id="add-error" class="error" hidden></p>
      <div id="sites"></div>
    </section>

    <section class="card">
      <h2 data-i18n="autoHeading"></h2>
      <label class="toggle">
        <input type="checkbox" id="field-detection">
        <span><strong data-i18n="fieldDetectionLabel"></strong><br>
          <span class="muted" data-i18n-html="fieldDetectionHelpHtml"></span></span>
      </label>
      <p id="detection-error" class="error" hidden></p>
      <label class="toggle sub">
        <input type="checkbox" id="sensitive-fields">
        <span><strong data-i18n="sensitiveLabel"></strong><br>
          <span class="muted" data-i18n="sensitiveHelp"></span></span>
      </label>
      <div class="sub-block">
        <strong data-i18n="exceptionsLabel"></strong><br>
        <span class="muted" data-i18n="exceptionsHelp"></span>
        <form id="add-exclusion" class="row">
          <input type="text" id="new-exclusion" data-i18n-placeholder="exclusionPlaceholder" spellcheck="false">
          <button type="submit" class="secondary" data-i18n="add"></button>
        </form>
        <p id="exclusion-error" class="error" hidden></p>
        <ul id="exclusions" class="plain-list"></ul>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="afterHeading"></h2>
      <label class="toggle">
        <input type="checkbox" id="clear-clipboard">
        <span><strong data-i18n="clipboardLabel"></strong><br>
          <span class="muted" data-i18n="clipboardHelp"></span></span>
      </label>
      <p class="muted" data-i18n-html="cleanupHelpHtml"></p>
    </section>

    <section class="card">
      <h2 data-i18n="alwaysOnHeading"></h2>
      <p class="muted" data-i18n-html="alwaysOnIntroHtml"></p>
      <div class="row spread list-tools">
        <label class="sort"><span data-i18n="sortBy"></span>
          <select id="sort">
            <option value="risk" data-i18n="sortRiskDesc"></option>
            <option value="risk-asc" data-i18n="sortRiskAsc"></option>
            <option value="name" data-i18n="sortName"></option>
          </select>
        </label>
      </div>
      <p class="legend">
        <span class="risk risk-high" data-i18n="risk_high"></span>
        <span class="risk risk-medium" data-i18n="risk_medium"></span>
        <span class="risk risk-low" data-i18n="risk_low"></span>
        <span class="muted" data-i18n="riskLegendNote"></span>
      </p>
      <ul id="global" class="ext-list"></ul>
    </section>

    <section class="card">
      <h2 data-i18n="backupHeading"></h2>
      <p class="muted" data-i18n="backupIntro"></p>
      <div class="row">
        <button id="export" class="secondary" data-i18n="exportSettings"></button>
        <label class="file-button secondary">
          <span data-i18n="importSettings"></span>
          <input type="file" id="import" accept="application/json,.json" hidden>
        </label>
      </div>
      <p id="import-result" class="muted" hidden></p>
    </section>

    <section class="card">
      <h2 data-i18n="goodToKnowHeading"></h2>
      <ul>
        <li data-i18n="tipDetection"></li>
        <li data-i18n="tipReload"></li>
        <li data-i18n="tipFrames"></li>
        <li data-i18n-html="tipMultipleHtml"></li>
        <li data-i18n="tipManualEnable"></li>
        <li data-i18n="tipManagers"></li>
        <li data-i18n="tipUninstall"></li>
        <li data-i18n="tipSiteAccess"></li>
      </ul>
    </section>

    <section class="card">
      <div class="row spread">
        <h2 data-i18n="logHeading"></h2>
        <button id="clear-log" class="secondary small" data-i18n="clearLog"></button>
      </div>
      <p class="muted" data-i18n="logIntro"></p>
      <ul id="log" class="log"></ul>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
